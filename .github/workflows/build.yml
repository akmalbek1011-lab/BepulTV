name: Build IPA

on:
  workflow_dispatch: {}
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Fayllarni joyiga qo'yish
        run: |
          mkdir -p Sources Support
          find . -maxdepth 1 -name '*.swift' -exec mv {} Sources/ \;
          [ -f Info.plist ] && mv Info.plist Support/
          [ -f BepulTV.entitlements ] && mv BepulTV.entitlements Support/
          sed -i '' 's/placement: \.topBarTrailing/placement: .navigationBarTrailing/' Sources/ContentView.swift
          echo "Sources:"; ls Sources
          echo "Support:"; ls Support

      - name: XcodeGen o'rnatish
        run: brew install xcodegen

      - name: Xcode loyihasini yaratish
        run: xcodegen generate

      - name: Yig'ish
        run: |
          set -o pipefail
          xcodebuild \
            -project BepulTV.xcodeproj \
            -scheme BepulTV \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log > /dev/null || {
              echo "=========== XATOLAR ==========="
              grep -E "error:" build.log | sort -u | head -40
              exit 1
            }
          echo "Yig'ish muvaffaqiyatli"

      - name: IPA qilish
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/BepulTV.app Payload/
          zip -qr BepulTV.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: BepulTV-ipa
          path: BepulTV.ipa
